name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановить пакеты
        run: dotnet restore FlightRadarScreensaver/FlightRadarScreensaver.csproj

      - name: Собрать (Release)
        run: dotnet build FlightRadarScreensaver/FlightRadarScreensaver.csproj -c Release --no-restore

      - name: Опубликовать
        run: dotnet publish FlightRadarScreensaver/FlightRadarScreensaver.csproj -c Release --no-build -o artifacts/publish

      - name: Создать .scr и добавить README
        shell: pwsh
        run: |
          $publish = 'artifacts/publish'
          Copy-Item "$publish/FlightRadarScreensaver.exe" "$publish/FlightRadarScreensaver.scr"
          Copy-Item 'README.md' "$publish/README.md"
          Write-Host "Готово: $publish/FlightRadarScreensaver.scr"

      - name: Проверить состав сборки
        shell: pwsh
        run: |
          $required = @(
            'artifacts/publish/FlightRadarScreensaver.scr',
            'artifacts/publish/FlightRadarScreensaver.dll',
            'artifacts/publish/FlightRadarScreensaver.deps.json',
            'artifacts/publish/FlightRadarScreensaver.runtimeconfig.json',
            'artifacts/publish/appsettings.json',
            'artifacts/publish/install.bat',
            'artifacts/publish/Assets/app.ico',
            'artifacts/publish/WebAssets/map.html',
            'artifacts/publish/WebAssets/leaflet.js',
            'artifacts/publish/WebAssets/leaflet.css'
          )

          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }

          if ($missing.Count -gt 0) {
            Write-Host "Отсутствуют обязательные файлы:"
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

          Write-Host "Все $($required.Count) обязательных файлов на месте"

      - name: Запаковать сборку
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish -DestinationPath FlightRadarScreensaver-win-x64.zip

      - name: Приложить сборку
        uses: actions/upload-artifact@v4
        with:
          name: FlightRadarScreensaver-win-x64
          path: FlightRadarScreensaver-win-x64.zip
          retention-days: 30