name: Release

# Релиз собирается при пуше тега вида v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Публикация релиза
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Определить тег
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          "value=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Тег релиза: $tag"

      - name: Собрать самодостаточную версию
        run: >-
          dotnet publish FlightRadarScreensaver/FlightRadarScreensaver.csproj
          -c Release -r win-x64 --self-contained true -o artifacts/publish

      - name: Подготовить пакет
        shell: pwsh
        run: |
          $publish = 'artifacts/publish'
          Copy-Item "$publish/FlightRadarScreensaver.exe" "$publish/FlightRadarScreensaver.scr"
          Copy-Item 'README.md' "$publish/README.md"
          Copy-Item 'LICENSE'   "$publish/LICENSE"

          Compress-Archive -Path $publish -DestinationPath "FlightRadarScreensaver-${{ steps.tag.outputs.value }}-win-x64.zip"

      - name: Подготовить заметки релиза
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.value }}'
          $notesPath = "release-notes-$version.md"

          if (Test-Path 'CHANGELOG.md') {
            $lines = Get-Content 'CHANGELOG.md'
            $hit = $lines | Select-String -SimpleMatch $version | Select-Object -First 1
            if ($hit) {
              $tail = $lines[($hit.LineNumber - 1)..($lines.Count - 1)]
              $next = $tail | Select-String -Pattern '^## ' | Select-Object -Skip 1 -First 1
              if ($next) { $tail = $tail[0..($next.LineNumber - 2)] }
              ($tail -join "`n") | Set-Content -Path $notesPath -Encoding UTF8
            }
          }

          if (-not (Test-Path $notesPath)) {
            $fallback = @(
              "## $version",
              '',
              'Сборка заставки FlightRadar Screensaver.',
              '',
              '**Установка:** распакуйте архив, запустите install.bat от имени',
              'администратора, затем выберите заставку в desk.cpl.'
            )
            Set-Content -Path $notesPath -Value $fallback -Encoding UTF8
          }

          Write-Host "Заметки релиза:"
          Get-Content $notesPath

      - name: Создать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: FlightRadar Screensaver ${{ steps.tag.outputs.value }}
          body_path: release-notes-${{ steps.tag.outputs.value }}.md
          files: FlightRadarScreensaver-${{ steps.tag.outputs.value }}-win-x64.zip
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag, '-') }}